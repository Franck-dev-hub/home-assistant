services:
  # Smart home core - interface & automatisation
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: homeassistant
    restart: always
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    depends_on:
      - mqtt
    environment:
      - TZ=Europe/Paris
    networks:
      - smarthome

  # Software messaging - IoT data broker (network)
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - smarthome

  # Hardware gateway - convert Zigbee radio to MQTT messages
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./zigbee2mqtt/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mqtt
    environment:
      - TZ=Europe/Paris
    networks:
      - smarthome

  # Local AI - self-hosted LLM for privacy
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - smarthome

  # Local STT - Speech To Text
  stt:
    image: rhasspy/wyoming-whisper
    container_name: sttC
    restart: always
    ports:
      - "10300:10300"
    volumes:
      - stt_data:/data
    command: --model tiny
    networks:
      - smarthome

  # Local TTS - Text To Speach
  tts:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: tts
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - tts_data:/home/ubuntu/.cache/huggingface/hub
    environment:
      - CHAT_COMPLETION_BASE_URL=${CHAT_COMPLETION_BASE_URL}
    depends_on:
      - ollama
    networks:
      - smarthome

  # TTS Wyoming bridge
  tts-wyoming:
    image: ghcr.io/roryeckel/wyoming_openai:latest
    container_name: tts-wyoming
    restart: always
    ports:
      - "10200:10200"
    environment:
      - WYOMING_URI=${WYOMING_URI}
      - WYOMING_LOG_LEVEL=${WYOMING_LOG_LEVEL}
      - WYOMING_LANGUAGES=${WYOMING_LANGUAGES}
      - TTS_OPENAI_URL=${TTS_OPENAI_URL}
      - TTS_MODELS=${TTS_MODELS}
      - TTS_BACKEND=${TTS_BACKEND}
      - TTS_VOICES=${TTS_VOICES}
    depends_on:
      - tts
    networks:
      - smarthome

volumes:
  ollama_data:
  stt_data:
  tts_data:

networks:
  smarthome:
    driver: bridge

