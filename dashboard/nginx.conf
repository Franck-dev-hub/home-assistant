server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    location /api/ha/ {
        set $proxy_upstream dashboard-proxy:4000;
        rewrite ^/api/ha/(.*)$ /$1 break;
        proxy_pass http://$proxy_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
