- id: '1780680191072'
  alias: Auto kitchen light
  description: ''
  triggers:
  - type: opened
    device_id: 925c53c41d003e92360e41dfa0d82940
    entity_id: 8269dc021d08cb3354e626c088e89a50
    domain: binary_sensor
    trigger: device
  conditions:
  - condition: sun
    before: sunrise
    after: sunset
    enabled: true
  actions:
  - action: light.turn_on
    metadata: {}
    target:
      device_id: fc1b0e8134abb1143349a8dab497b18a
    data: {}
  mode: single
- id: '1786550000000'
  alias: Tuya daily safety reload
  description: Daily backup reload, with retry.
  triggers:
  - trigger: time
    at: "04:00:00"
  conditions: []
  actions:
  - repeat:
      until:
      - condition: template
        value_template: >-
          {{ (integration_entities('tuya') | select('is_state', 'unavailable') | list | length == 0) or repeat.index >= 5 }}
      sequence:
      - action: homeassistant.reload_config_entry
        metadata: {}
        data:
          entry_id: 01KZK85WJY1W6046F4QQV02TQC
      - delay: "00:01:30"
  - if:
    - condition: template
      value_template: >-
        {{ integration_entities('tuya') | select('is_state', 'unavailable') | list | length > 0 }}
    then:
    - action: persistent_notification.create
      data:
        title: "Tuya still offline"
        message: 5 reload attempts failed. Manual reauth likely needed.
        notification_id: tuya_reload_failed
  mode: single
- id: '1786550000001'
  alias: Tuya reactive reload (MQTT crash detected)
  description: Reactive reload on Tuya error, with retry.
  triggers:
  - trigger: event
    event_type: system_log_event
    event_data:
      level: ERROR
  conditions:
  - condition: template
    value_template: >-
      {{ 'tuya_sharing' in (trigger.event.data.exception | default('')) or
         'API_QPS_LIMIT_OR_DEGRADE' in (trigger.event.data.exception | default('')) or
         'for tuya' in (trigger.event.data.message | default([]) | join(' ')) or
         'tuya_sharing' in (trigger.event.data.message | default([]) | join(' ')) }}
  actions:
  - repeat:
      until:
      - condition: template
        value_template: >-
          {{ (integration_entities('tuya') | select('is_state', 'unavailable') | list | length == 0) or repeat.index >= 5 }}
      sequence:
      - action: homeassistant.reload_config_entry
        metadata: {}
        data:
          entry_id: 01KZK85WJY1W6046F4QQV02TQC
      - delay: "00:01:30"
  - if:
    - condition: template
      value_template: >-
        {{ integration_entities('tuya') | select('is_state', 'unavailable') | list | length > 0 }}
    then:
    - action: persistent_notification.create
      data:
        title: "Tuya still offline"
        message: 5 reload attempts failed. Manual reauth likely needed.
        notification_id: tuya_reload_failed
  mode: single
